<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>竞品图册 · 内部</title>
  <style>
    body { margin: 0; font-family: "PingFang SC", sans-serif; background: #f6f3ee; color: #2c1810; }
    main { max-width: 1080px; margin: 0 auto; padding: 32px 20px 64px; }
    h1 { font-size: 28px; }
    p, li { line-height: 1.65; color: #5a4336; }
    h2 { margin-top: 40px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
    figure { margin: 0; background: #fff; border: 1px solid #e6ddd2; border-radius: 10px; overflow: hidden; }
    img { width: 100%; height: 180px; object-fit: contain; background: #f3eee6; display: block; }
    figcaption { padding: 8px 10px 12px; font-size: 12px; }
    .hero img { height: auto; max-height: 420px; object-fit: cover; }
  </style>
</head>
<body>
  <main>
    <h1>内部图册</h1>
    <p>源氏图仅供对照，勿用于头木官网。文字结论见同目录 Markdown。</p>

</html>
